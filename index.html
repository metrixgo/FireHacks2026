<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Exercise Route Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-panel {
            width: 35%;
            background: #f8f9fa;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .right-panel {
            width: 65%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 1.5rem;
            color: #212529;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.2rem;
            color: #495057;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
        }

        input, textarea {
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .location-inputs {
            display: flex;
            gap: 10px;
        }

        .location-inputs input {
            flex: 1;
        }

        button {
            padding: 12px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .auto-detect-btn {
            background: #6c757d;
            padding: 10px 15px;
            font-size: 0.85rem;
        }

        .auto-detect-btn:hover {
            background: #545b62;
        }

        .ai-summary {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            min-height: 100px;
        }

        .ai-summary h3 {
            font-size: 1rem;
            color: #007bff;
            margin-bottom: 10px;
        }

        .ai-summary p {
            line-height: 1.6;
            color: #495057;
        }

        .routes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .route-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            cursor: pointer;
            transition: all 0.2s;
        }

        .route-item:hover {
            border-color: #007bff;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.15);
        }

        .route-item.selected {
            border-color: #007bff;
            background: #f0f7ff;
        }

        .route-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .route-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: #28a745;
        }

        .route-details {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .route-detail {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .error.active {
            display: block;
        }

        .weight-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .weight-control {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .weight-control label {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .weight-control input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .score-breakdown {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .score-breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }

        .score-breakdown-item span:first-child {
            color: #6c757d;
        }

        .score-breakdown-item span:last-child {
            font-weight: 600;
        }

        .total-weight {
            text-align: center;
            padding: 8px;
            background: #e9ecef;
            border-radius: 4px;
            font-weight: 600;
            margin-top: 10px;
        }

        .total-weight.valid {
            background: #d4edda;
            color: #155724;
        }

        .total-weight.invalid {
            background: #f8d7da;
            color: #721c24;
        }

        .analysis-panel {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            margin-top: 15px;
        }

        .analysis-panel h3 {
            font-size: 1rem;
            color: #007bff;
            margin-bottom: 10px;
        }

        .analysis-content {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>AI Route Planner</h1>
            
            <div class="form-group">
                <label>Location</label>
                <div class="location-inputs">
                    <input type="text" id="latitude" placeholder="Latitude" step="any">
                    <input type="text" id="longitude" placeholder="Longitude" step="any">
                    <button class="auto-detect-btn" id="autoDetect">📍 Auto</button>
                </div>
            </div>

            <div class="form-group">
                <label for="prompt">Your Exercise Goal</label>
                <textarea id="prompt" placeholder="e.g., I want to run for 5 miles."></textarea>
            </div>

            <div class="form-group">
                <label>Route Scoring Weights (adjust priorities)</label>
                <div class="weight-controls">
                    <div class="weight-control">
                        <label>Distance Accuracy: <span id="distanceWeight">40</span>%</label>
                        <input type="range" id="distanceSlider" min="0" max="100" value="40">
                    </div>
                    <div class="weight-control">
                        <label>Air Quality: <span id="aqiWeight">30</span>%</label>
                        <input type="range" id="aqiSlider" min="0" max="100" value="30">
                    </div>
                    <div class="weight-control">
                        <label>Greenery: <span id="greeneryWeight">15</span>%</label>
                        <input type="range" id="greenerySlider" min="0" max="100" value="15">
                    </div>
                    <div class="weight-control">
                        <label>Safety: <span id="safetyWeight">15</span>%</label>
                        <input type="range" id="safetySlider" min="0" max="100" value="15">
                    </div>
                </div>
            </div>

            <button id="findRoute">Find Best Route</button>

            <div class="error" id="error"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Finding the perfect route for you...</p>
            </div>

            <div class="ai-summary" id="aiSummary">
                <h3>AI Recommendation</h3>
                <p>Enter your location and exercise goal to get personalized route recommendations.</p>
            </div>

            <div class="routes-list" id="routesList"></div>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="analyzeAI" style="flex: 1; background: #28a745;">Analyze AI Decision</button>
                <button id="showHeatmap" style="flex: 1; background: #17a2b8;">Show Score Heatmap</button>
                <button id="showNavigation" style="flex: 1; background: #6f42c1;">Show Navigation</button>
            </div>
            
            <div class="analysis-panel" id="aiAnalysis" style="display: none;">
                <h3>AI Decision Analysis</h3>
                <div class="analysis-content" id="aiAnalysisContent"></div>
            </div>
            
            <div class="analysis-panel" id="heatmapLegend" style="display: none;">
                <h3>Route Color Legend</h3>
                <div class="analysis-content">
                    <div style="display: flex; align-items: center; gap: 10px; margin: 5px 0;">
                        <div style="width: 20px; height: 20px; background: #28a745; border-radius: 3px;"></div>
                        <span>High Score (>75)</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; margin: 5px 0;">
                        <div style="width: 20px; height: 20px; background: #ffc107; border-radius: 3px;"></div>
                        <span>Medium Score (50-75)</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; margin: 5px 0;">
                        <div style="width: 20px; height: 20px; background: #dc3545; border-radius: 3px;"></div>
                        <span>Low Score (<50)</span>
                    </div>
                </div>
            </div>
            
            <div class="analysis-panel" id="navigationPanel" style="display: none;">
                <h3>Turn-by-Turn Navigation</h3>
                <div class="analysis-content" id="navigationContent"></div>
            </div>
        </div>

        <div class="right-panel">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([40.7128, -74.0060], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let currentRouteLayer = null;
        let routes = [];
        let routeData = null;
        let heatmapLayers = [];
        let showHeatmap = false;

        // DOM elements
        const latitudeInput = document.getElementById('latitude');
        const longitudeInput = document.getElementById('longitude');
        const autoDetectBtn = document.getElementById('autoDetect');
        const promptInput = document.getElementById('prompt');
        const findRouteBtn = document.getElementById('findRoute');
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const aiSummaryDiv = document.getElementById('aiSummary');
        const routesListDiv = document.getElementById('routesList');

        // Weight sliders
        const distanceSlider = document.getElementById('distanceSlider');
        const aqiSlider = document.getElementById('aqiSlider');
        const greenerySlider = document.getElementById('greenerySlider');
        const safetySlider = document.getElementById('safetySlider');
        const distanceWeight = document.getElementById('distanceWeight');
        const aqiWeight = document.getElementById('aqiWeight');
        const greeneryWeight = document.getElementById('greeneryWeight');
        const safetyWeight = document.getElementById('safetyWeight');

        // Update weight displays with auto-adjustment
        function updateWeightDisplays(changedSlider = null) {
            const distanceVal = parseInt(distanceSlider.value);
            const aqiVal = parseInt(aqiSlider.value);
            const greeneryVal = parseInt(greenerySlider.value);
            const safetyVal = parseInt(safetySlider.value);
            
            let total = distanceVal + aqiVal + greeneryVal + safetyVal;
            
            distanceWeight.textContent = distanceVal;
            aqiWeight.textContent = aqiVal;
            greeneryWeight.textContent = greeneryVal;
            safetyWeight.textContent = safetyVal;
            
            // Auto-adjust if changed and total != 100
            if (changedSlider && total !== 100) {
                const diff = 100 - total;
                const otherSliders = [distanceSlider, aqiSlider, greenerySlider, safetySlider].filter(s => s !== changedSlider);
                const adjustment = diff / otherSliders.length;
                
                otherSliders.forEach(slider => {
                    let newVal = parseInt(slider.value) + adjustment;
                    newVal = Math.max(0, Math.min(100, Math.round(newVal)));
                    slider.value = newVal;
                });
                
                // Recalculate total
                total = parseInt(distanceSlider.value) + parseInt(aqiSlider.value) + 
                        parseInt(greenerySlider.value) + parseInt(safetySlider.value);
                
                // Update displays again
                distanceWeight.textContent = distanceSlider.value;
                aqiWeight.textContent = aqiSlider.value;
                greeneryWeight.textContent = greenerySlider.value;
                safetyWeight.textContent = safetySlider.value;
            }
            
            return total;
        }

        // Add event listeners to sliders with auto-adjustment
        [distanceSlider, aqiSlider, greenerySlider, safetySlider].forEach(slider => {
            slider.addEventListener('input', (e) => {
                updateWeightDisplays(e.target);
                // Re-score routes if we have route data
                if (routeData && routeData.routes.length > 0) {
                    reScoreRoutes();
                }
            });
        });

        // Re-score routes based on new weights
        function reScoreRoutes() {
            if (!routeData || !routeData.routes) return;
            
            const weights = {
                distance: parseInt(distanceSlider.value) / 100,
                aqi: parseInt(aqiSlider.value) / 100,
                greenery: parseInt(greenerySlider.value) / 100,
                safety: parseInt(safetySlider.value) / 100
            };
            
            // Re-calculate scores for each route
            routeData.routes.forEach(route => {
                const breakdown = route.score_breakdown;
                const newScore = (weights.distance * breakdown.distance_score) + 
                                (weights.aqi * breakdown.aqi_score) + 
                                (weights.greenery * breakdown.greenery_score) + 
                                (weights.safety * breakdown.safety_score);
                route.score = newScore;
            });
            
            // Re-sort routes
            routeData.routes.sort((a, b) => b.score - a.score);
            
            // Update the display
            updateRoutesDisplay();
        }

        // Update routes display without regenerating
        function updateRoutesDisplay() {
            if (!routeData || !routeData.routes) return;
            
            routes = routeData.routes;
            
            // Update routes list
            routesListDiv.innerHTML = '';
            routeData.routes.forEach((route, index) => {
                const routeItem = document.createElement('div');
                routeItem.className = 'route-item';
                
                const breakdown = route.score_breakdown;
                routeItem.innerHTML = `
                    <div class="route-header">
                        <span>Route ${index + 1} - ${route.description}</span>
                        <span class="route-score">${route.score.toFixed(1)}</span>
                    </div>
                    <div class="route-details">
                        <span class="route-detail">📏 ${route.distance.toFixed(2)} mi</span>
                        <span class="route-detail">🌫️ AQI: ${route.aqi}</span>
                        <span class="route-detail">🔄 ${route.pattern}</span>
                    </div>
                    <div class="score-breakdown">
                        <div class="score-breakdown-item">
                            <span>Distance Score:</span>
                            <span>${breakdown.distance_score.toFixed(1)}</span>
                        </div>
                        <div class="score-breakdown-item">
                            <span>AQI Score:</span>
                            <span>${breakdown.aqi_score.toFixed(1)}</span>
                        </div>
                        <div class="score-breakdown-item">
                            <span>Greenery Score:</span>
                            <span>${breakdown.greenery_score.toFixed(1)}</span>
                        </div>
                        <div class="score-breakdown-item">
                            <span>Safety Score:</span>
                            <span>${breakdown.safety_score.toFixed(1)}</span>
                        </div>
                    </div>
                `;
                routeItem.addEventListener('click', () => selectRoute(index, routeItem));
                routesListDiv.appendChild(routeItem);
            });
            
            // Keep current selection if possible
            const selectedRoute = document.querySelector('.route-item.selected');
            if (selectedRoute && routes.length > 0) {
                const index = Array.from(routesListDiv.children).indexOf(selectedRoute);
                if (index >= 0 && index < routes.length) {
                    selectRoute(index, routesListDiv.children[index]);
                } else {
                    selectRoute(0, routesListDiv.firstChild);
                }
            } else if (routes.length > 0) {
                selectRoute(0, routesListDiv.firstChild);
            }
        }

        // AI Analysis button
        document.getElementById('analyzeAI').addEventListener('click', () => {
            if (!routeData || !routeData.routes || routeData.routes.length === 0) {
                showError('Please find routes first before analyzing AI decisions.');
                return;
            }

            const analysisPanel = document.getElementById('aiAnalysis');
            const analysisContent = document.getElementById('aiAnalysisContent');
            
            const bestRoute = routeData.routes[0];
            const targetDistance = routeData.target_distance * 0.000621371; // Convert to miles
            const actualDistance = bestRoute.distance;
            const distanceVariance = Math.abs(actualDistance - targetDistance) / targetDistance * 100;
            
            let analysis = '';
            
            // Analyze distance match
            if (distanceVariance > 50) {
                analysis += `<p><strong>⚠️ Distance Mismatch:</strong> The AI chose a route that is ${distanceVariance.toFixed(1)}% different from your target. This might be because other factors (AQI, safety) were weighted higher.</p>`;
            } else if (distanceVariance > 20) {
                analysis += `<p><strong>📏 Distance Variance:</strong> The route is ${distanceVariance.toFixed(1)}% different from target. Consider adjusting distance weight if this is important to you.</p>`;
            } else {
                analysis += `<p><strong>✅ Good Distance Match:</strong> The route closely matches your target distance (${distanceVariance.toFixed(1)}% variance).</p>`;
            }
            
            // Analyze AQI impact
            const aqiScore = bestRoute.score_breakdown.aqi_score;
            if (aqiScore < 50) {
                analysis += `<p><strong>🌫️ Poor Air Quality:</strong> This route has low air quality score (${aqiScore.toFixed(1)}). The AI might have prioritized other factors. Consider increasing AQI weight if air quality matters to you.</p>`;
            } else if (aqiScore > 80) {
                analysis += `<p><strong>✅ Excellent Air Quality:</strong> This route has great air quality score (${aqiScore.toFixed(1)}).</p>`;
            }
            
            // Analyze weight impact
            const weights = routeData.weights_used;
            if (weights.distance > 0.5) {
                analysis += `<p><strong>🎯 Distance Focused:</strong> You prioritized distance accuracy (${(weights.distance * 100).toFixed(0)}%), which heavily influenced the AI's choice.</p>`;
            }
            if (weights.aqi > 0.3) {
                analysis += `<p><strong>🌫️ Air Quality Focused:</strong> You prioritized air quality (${(weights.aqi * 100).toFixed(0)}%), which influenced the AI to favor routes with better AQI.</p>`;
            }
            
            // Overall assessment
            analysis += `<p><strong>💡 Recommendation:</strong> `;
            if (bestRoute.score > 75) {
                analysis += `The AI found a well-balanced route matching your preferences. Total score: ${bestRoute.score.toFixed(1)}/100.`;
            } else if (bestRoute.score > 50) {
                analysis += `The route is acceptable but could be improved. Try adjusting the weights to better match your priorities.`;
            } else {
                analysis += `The AI struggled to find a great match. Consider adjusting your location constraints or weight preferences.`;
            }
            analysis += `</p>`;
            
            analysisContent.innerHTML = analysis;
            analysisPanel.style.display = 'block';
        });

        // Navigation button
        document.getElementById('showNavigation').addEventListener('click', () => {
            if (!routeData || !routeData.routes || routeData.routes.length === 0) {
                showError('Please find routes first before showing navigation.');
                return;
            }

            const navigationPanel = document.getElementById('navigationPanel');
            const navigationContent = document.getElementById('navigationContent');
            
            // Get the currently selected or best route
            const selectedRouteIndex = Array.from(routesListDiv.children).findIndex(item => item.classList.contains('selected'));
            const routeIndex = selectedRouteIndex >= 0 ? selectedRouteIndex : 0;
            const route = routeData.routes[routeIndex];
            
            if (!route.turn_by_turn || route.turn_by_turn.length === 0) {
                navigationContent.innerHTML = '<p>No turn-by-turn directions available for this route.</p>';
                navigationPanel.style.display = 'block';
                return;
            }
            
            let navigationHTML = `<p><strong>Route:</strong> ${route.description}</p>`;
            navigationHTML += `<p><strong>Total Distance:</strong> ${route.distance.toFixed(2)} miles</p>`;
            navigationHTML += '<div style="margin-top: 15px;"><strong>Directions:</strong></div>';
            
            route.turn_by_turn.forEach((step, index) => {
                const distance = (step.distance * 0.000621371).toFixed(2); // Convert to miles
                navigationHTML += `
                    <div style="padding: 8px; border-left: 3px solid #007bff; margin: 8px 0; background: #f8f9fa;">
                        <div style="font-weight: 600;">${index + 1}. ${step.instruction}</div>
                        <div style="font-size: 0.85rem; color: #6c757d; margin-top: 4px;">
                            Distance: ${distance} miles | Bearing: ${step.bearing.toFixed(0)}°
                        </div>
                    </div>
                `;
            });
            
            navigationContent.innerHTML = navigationHTML;
            navigationPanel.style.display = 'block';
            
            // Add navigation markers to map
            addNavigationMarkers(route);
        });

        function addNavigationMarkers(route) {
            // Remove existing navigation markers
            if (window.navigationMarkers) {
                window.navigationMarkers.forEach(marker => map.removeLayer(marker));
            }
            window.navigationMarkers = [];
            
            // Add markers for each turn point
            const coords = route.geojson.geometry.coordinates;
            coords.forEach((coord, index) => {
                const marker = L.marker([coord[1], coord[0]], {
                    icon: L.divIcon({
                        className: 'navigation-marker',
                        html: `<div style="background: #007bff; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; border: 2px solid white;">${index + 1}</div>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    })
                }).addTo(map);
                
                if (route.turn_by_turn[index]) {
                    marker.bindPopup(`<strong>Step ${index + 1}</strong><br>${route.turn_by_turn[index].instruction}`);
                }
                
                window.navigationMarkers.push(marker);
            });
        }

        // Heatmap button
        document.getElementById('showHeatmap').addEventListener('click', () => {
            if (!routeData || !routeData.routes || routeData.routes.length === 0) {
                showError('Please find routes first before showing heatmap.');
                return;
            }

            // Clear existing heatmap layers
            heatmapLayers.forEach(layer => map.removeLayer(layer));
            heatmapLayers = [];

            // Remove current single route selection
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
                currentRouteLayer = null;
            }

            showHeatmap = !showHeatmap;
            const heatmapBtn = document.getElementById('showHeatmap');
            const legend = document.getElementById('heatmapLegend');

            if (showHeatmap) {
                heatmapBtn.textContent = 'Hide Score Heatmap';
                heatmapBtn.style.background = '#dc3545';
                legend.style.display = 'block';

                // Remove navigation markers if present
                if (window.navigationMarkers) {
                    window.navigationMarkers.forEach(marker => map.removeLayer(marker));
                    window.navigationMarkers = [];
                }

                // Add all routes with score-based colors
                routeData.routes.forEach((route, index) => {
                    const score = route.score;
                    let color;
                    if (score > 75) {
                        color = '#28a745'; // Green
                    } else if (score > 50) {
                        color = '#ffc107'; // Yellow
                    } else {
                        color = '#dc3545'; // Red
                    }

                    const layer = L.geoJSON(route.geojson, {
                        style: {
                            color: color,
                            weight: 4,
                            opacity: 0.7
                        }
                    }).addTo(map);

                    // Add popup with route info
                    layer.bindPopup(`
                        <strong>Route ${index + 1}</strong><br>
                        Score: ${score.toFixed(1)}<br>
                        Distance: ${route.distance.toFixed(2)} mi<br>
                        AQI: ${route.aqi}
                    `);

                    heatmapLayers.push(layer);
                });

                // Fit map to show all routes
                if (heatmapLayers.length > 0) {
                    const group = L.featureGroup(heatmapLayers);
                    map.fitBounds(group.getBounds(), { padding: [50, 50] });
                }
            } else {
                heatmapBtn.textContent = 'Show Score Heatmap';
                heatmapBtn.style.background = '#17a2b8';
                legend.style.display = 'none';

                // Reselect the first route
                if (routes.length > 0) {
                    selectRoute(0, routesListDiv.firstChild);
                }
            }
        });

        // Auto-detect location
        autoDetectBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                autoDetectBtn.disabled = true;
                autoDetectBtn.textContent = '🔄 Locating...';
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        latitudeInput.value = position.coords.latitude.toFixed(6);
                        longitudeInput.value = position.coords.longitude.toFixed(6);
                        map.setView([position.coords.latitude, position.coords.longitude], 14);
                        
                        // Add marker for user location
                        L.marker([position.coords.latitude, position.coords.longitude])
                            .addTo(map)
                            .bindPopup('Your Location')
                            .openPopup();
                        
                        autoDetectBtn.disabled = false;
                        autoDetectBtn.textContent = '📍 Auto';
                    },
                    (error) => {
                        let errorMsg = 'Unable to detect location.';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMsg = 'Location permission denied. Please enable location access.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMsg = 'Location information unavailable.';
                                break;
                            case error.TIMEOUT:
                                errorMsg = 'Location request timed out.';
                                break;
                        }
                        showError(errorMsg + ' Please enter coordinates manually.');
                        autoDetectBtn.disabled = false;
                        autoDetectBtn.textContent = '📍 Auto';
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                showError('Geolocation is not supported by your browser.');
            }
        });

        // Convert DMS to decimal degrees
        function parseDMSToDD(dms) {
            // Handle decimal degrees directly
            if (!isNaN(parseFloat(dms)) && isFinite(dms)) {
                return parseFloat(dms);
            }
            
            // Parse DMS format like: 37°41'09.0"N or 121°53'39.7"W
            const dmsRegex = /(\d+)[°](\d+)[']([\d.]+)["]?([NSEW])/i;
            const match = dms.match(dmsRegex);
            
            if (match) {
                let degrees = parseFloat(match[1]);
                let minutes = parseFloat(match[2]);
                let seconds = parseFloat(match[3]);
                let direction = match[4].toUpperCase();
                
                let dd = degrees + minutes/60 + seconds/3600;
                
                if (direction === 'S' || direction === 'W') {
                    dd = dd * -1;
                }
                
                return dd;
            }
            
            return NaN;
        }

        // Find route
        findRouteBtn.addEventListener('click', async () => {
            const latInput = latitudeInput.value.trim();
            const lonInput = longitudeInput.value.trim();
            const prompt = promptInput.value.trim();

            // Parse coordinates (handle both decimal and DMS formats)
            const lat = parseDMSToDD(latInput);
            const lon = parseDMSToDD(lonInput);

            if (isNaN(lat) || isNaN(lon)) {
                showError('Please enter valid coordinates (decimal degrees or DMS format). Example: 37.6858 or 37°41\'09.0"N');
                return;
            }

            if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                showError('Coordinates out of valid range. Latitude: -90 to 90, Longitude: -180 to 180');
                return;
            }

            if (!prompt) {
                showError('Please enter your exercise goal.');
                return;
            }

            // Check weights total
            const totalWeight = updateWeightDisplays();
            if (totalWeight !== 100) {
                showError(`Weights must total 100%. Current total: ${totalWeight}%`);
                return;
            }

            // Get weights
            const weights = {
                distance: parseInt(distanceSlider.value) / 100,
                aqi: parseInt(aqiSlider.value) / 100,
                greenery: parseInt(greenerySlider.value) / 100,
                safety: parseInt(safetySlider.value) / 100
            };

            loadingDiv.classList.add('active');
            errorDiv.classList.remove('active');
            findRouteBtn.disabled = true;

            try {
                // First test API health
                console.log('Testing API health...');
                const healthResponse = await fetch('https://firehacks2026.onrender.com/api/health');
                if (!healthResponse.ok) {
                    throw new Error('API health check failed');
                }
                console.log('API health check passed');

                const response = await fetch('https://firehacks2026.onrender.com/api/plan-route', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        latitude: lat,
                        longitude: lon,
                        prompt: prompt,
                        weights: weights
                    })
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    let errorData;
                    try {
                        errorData = JSON.parse(errorText);
                    } catch (e) {
                        errorData = { detail: errorText };
                    }
                    throw new Error(errorData.detail || `Failed to get route recommendations (Status: ${response.status})`);
                }

                const data = await response.json();
                console.log('Response data:', data);
                routeData = data;
                displayResults(data);
            } catch (error) {
                console.error('Full error:', error);
                showError('Error: ' + error.message);
            } finally {
                loadingDiv.classList.remove('active');
                findRouteBtn.disabled = false;
            }
        });

        function displayResults(data) {
            // Update AI summary
            aiSummaryDiv.innerHTML = `
                <h3>AI Recommendation</h3>
                <p>${data.summary}</p>
                <div class="analysis-panel">
                    <h3>Route Analysis</h3>
                    <div class="analysis-content">
                        <p><strong>Target Distance:</strong> ${(data.target_distance * 0.000621371).toFixed(2)} miles</p>
                        <p><strong>Weights Used:</strong> Distance: ${(data.weights_used.distance * 100).toFixed(0)}%, 
                           AQI: ${(data.weights_used.aqi * 100).toFixed(0)}%, 
                           Greenery: ${(data.weights_used.greenery * 100).toFixed(0)}%, 
                           Safety: ${(data.weights_used.safety * 100).toFixed(0)}%</p>
                    </div>
                </div>
            `;

            // Store routes
            routes = data.routes;

            // Display routes list
            routesListDiv.innerHTML = '';
            routes.forEach((route, index) => {
                const routeItem = document.createElement('div');
                routeItem.className = 'route-item';
                
                const breakdown = route.score_breakdown;
                routeItem.innerHTML = `
                    <div class="route-header">
                        <span>Route ${index + 1}</span>
                        <span class="route-score">${route.score.toFixed(1)}</span>
                    </div>
                    <div class="route-details">
                        <span class="route-detail">📏 ${route.distance.toFixed(2)} mi</span>
                        <span class="route-detail">🌫️ AQI: ${route.aqi}</span>
                    </div>
                    <div class="score-breakdown">
                        <div class="score-breakdown-item">
                            <span>Distance Score:</span>
                            <span>${breakdown.distance_score.toFixed(1)}</span>
                        </div>
                        <div class="score-breakdown-item">
                            <span>AQI Score:</span>
                            <span>${breakdown.aqi_score.toFixed(1)}</span>
                        </div>
                        <div class="score-breakdown-item">
                            <span>Greenery Score:</span>
                            <span>${breakdown.greenery_score.toFixed(1)}</span>
                        </div>
                        <div class="score-breakdown-item">
                            <span>Safety Score:</span>
                            <span>${breakdown.safety_score.toFixed(1)}</span>
                        </div>
                    </div>
                `;
                routeItem.addEventListener('click', () => selectRoute(index, routeItem));
                routesListDiv.appendChild(routeItem);
            });

            // Select first route by default
            if (routes.length > 0) {
                selectRoute(0, routesListDiv.firstChild);
            }
        }

        function selectRoute(index, element) {
            // If heatmap is active, switch back to single route mode
            if (showHeatmap) {
                document.getElementById('showHeatmap').click();
            }

            // Hide navigation panel
            document.getElementById('navigationPanel').style.display = 'none';

            // Remove navigation markers if present
            if (window.navigationMarkers) {
                window.navigationMarkers.forEach(marker => map.removeLayer(marker));
                window.navigationMarkers = [];
            }

            // Update UI selection
            document.querySelectorAll('.route-item').forEach(item => item.classList.remove('selected'));
            element.classList.add('selected');

            // Remove previous route layer
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
            }

            // Add new route
            const route = routes[index];
            console.log('Route data:', route); // Debug logging
            
            try {
                currentRouteLayer = L.geoJSON(route.geojson, {
                    style: {
                        color: '#007bff',
                        weight: 5,
                        opacity: 0.8
                    }
                }).addTo(map);

                // Fit map to route
                if (currentRouteLayer.getBounds()) {
                    map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });
                } else {
                    console.error('No bounds for route');
                }
            } catch (error) {
                console.error('Error displaying route:', error);
                showError('Error displaying route on map');
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }
    </script>
</body>
</html>
